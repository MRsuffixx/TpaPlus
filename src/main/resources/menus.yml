config-version: 2
shared:
  previous: {material: ARROW, name: "<yellow>Previous page", slot: 45}
  close: {material: BARRIER, name: "<red>Close", slot: 49}
  next: {material: ARROW, name: "<yellow>Next page", slot: 53}
pending:
  title: "<dark_aqua>TpaPro Requests <gray>(<page>/<total_pages>)"
  size: 54
  item: {material: ENDER_PEARL, name: "<aqua><player>", lore: ["<gray><request_type>", "<green>Left-click: accept", "<red>Right-click: deny"]}
settings:
  title: "<dark_aqua>TpaPro Settings"
  size: 27
