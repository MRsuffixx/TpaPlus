meta:
  locale: en_US
  name: English
  version: 1
prefix: "<dark_aqua><bold>TpaPro</bold></dark_aqua> <dark_gray>»</dark_gray> "
errors:
  no-permission: "<red>You do not have permission to do that.</red>"
  player-only: "<red>This command can only be used by a player.</red>"
  invalid-usage: "<red>Usage: <usage></red>"
  player-not-found: "<red>Player <player> was not found.</red>"
  player-offline: "<red><player> must be online for this action.</red>"
  self-target: "<red>You cannot target yourself.</red>"
  invalid-number: "<red><value> is not a valid number.</red>"
  invalid-value: "<red>Invalid value. Expected <expected>.</red>"
  internal: "<red>The operation failed safely. Please contact an administrator.</red>"
  not-ready: "<yellow>TpaPro is still initializing its storage. Try again shortly.</yellow>"
  database-unavailable: "<red>Persistent storage is currently unavailable.</red>"
  unsafe-destination: "<red>No safe destination could be found.</red>"
  world-unavailable: "<red>The destination world is unavailable.</red>"
  teleport-failed: "<red>Teleportation failed: <reason>.</red>"
  feature-disabled: "<yellow>This feature is disabled.</yellow>"
request:
  sent: "<green>Teleport request sent to <target>.</green>"
  received:
    message: "<gray><white><sender></white> sent you a <request_type> request.</gray>"
    accept-button: "<green>[Accept]</green>"
    accept-hover: "<green>Accept this request</green>"
    deny-button: "<red>[Deny]</red>"
    deny-hover: "<red>Deny this request</red>"
  duplicate: "<yellow>An equivalent request is already pending.</yellow>"
  replaced: "<yellow>The previous request was replaced.</yellow>"
  refreshed: "<yellow>The existing request expiry was refreshed.</yellow>"
  sender-limit: "<red>You have reached the outgoing request limit (<limit>).</red>"
  target-limit: "<red><target> cannot receive more pending requests.</red>"
  blocked: "<red><target> is not accepting requests from you.</red>"
  privacy: "<red><target>'s privacy settings reject this request.</red>"
  no-pending: "<yellow>You have no pending requests.</yellow>"
  no-outgoing: "<yellow>You have no outgoing requests.</yellow>"
  multiple: "<yellow>Multiple requests are pending; specify a player:</yellow>"
  list-entry: "<gray>• <white><sender></white> — <request_type> — <seconds>s</gray>"
  accepted-sender: "<green><target> accepted your request.</green>"
  accepted-target: "<green>You accepted <sender>'s request.</green>"
  denied-sender: "<red><target> denied your request.</red>"
  denied-target: "<yellow>You denied <sender>'s request.</yellow>"
  cancelled-sender: "<yellow>You cancelled the request to <target>.</yellow>"
  cancelled-target: "<yellow><sender> cancelled their request.</yellow>"
  expired-sender: "<yellow>Your request to <target> expired.</yellow>"
  expired-target: "<yellow><sender>'s request expired.</yellow>"
  invalid-state: "<red>That request is no longer actionable.</red>"
  cleared: "<green>Cleared <count> active requests for <player>.</green>"
cooldown:
  active: "<yellow>Please wait <seconds>s before doing that again.</yellow>"
  reset: "<green>Reset all teleport cooldowns for <player>.</green>"
warmup:
  started: "<aqua>Teleporting in <seconds>s. Do not move.</aqua>"
  countdown: "<aqua>Teleporting in <seconds>s…</aqua>"
  title: "<aqua><seconds></aqua>"
  subtitle: "<gray>Do not move</gray>"
  cancelled: "<red>Teleport cancelled: <reason>.</red>"
  reasons:
    moved: "you moved"
    damaged: "you took damage"
    attacked: "you attacked another entity"
    world-change: "you changed worlds"
    quit: "you disconnected"
    death: "you died"
    command: "you used a command"
    replaced: "a newer teleport started"
    shutdown: "the plugin stopped"
    request-invalid: "the request became invalid"
teleport:
  success: "<green>Teleport complete.</green>"
  target-success: "<gray><player> teleported to you.</gray>"
  back-saved: "<gray>Your previous location was saved.</gray>"
  back-missing: "<yellow>You have no valid previous location.</yellow>"
  back-expired: "<yellow>Your previous location has expired.</yellow>"
  cross-world-blocked: "<red>Teleporting between these worlds is blocked.</red>"
  world-blocked: "<red>Teleportation is disabled in <world>.</red>"
  region-blocked: "<red>Teleportation is blocked in this region.</red>"
  combat-blocked: "<red>You cannot do that while in combat.</red>"
trap:
  warning: "<gold>Destination risk detected: <reason>.</gold>"
  continue: "<green>[Continue]</green>"
  continue-hover: "<green>Continue this specific teleport</green>"
  cancel: "<red>[Cancel]</red>"
  cancel-hover: "<red>Cancel this teleport</red>"
  blocked: "<red>Teleport blocked due to destination risk: <reason>.</red>"
  token-invalid: "<red>This confirmation is invalid or expired.</red>"
  capacity: "<red>Teleport confirmation capacity is temporarily full. Please try again shortly.</red>"
economy:
  unavailable: "<red>Economy service is unavailable.</red>"
  insufficient: "<red>You need <cost>; your balance is <balance>.</red>"
  charged: "<gray>Charged <cost>.</gray>"
  refunded: "<gray>Refunded <cost> because the teleport failed.</gray>"
  failed: "<red>The economy transaction failed.</red>"
privacy:
  enabled: "<green>Incoming teleport requests enabled.</green>"
  disabled: "<yellow>Incoming teleport requests disabled.</yellow>"
  mode-set: "<green>Privacy mode set to <mode>.</green>"
  friends-unavailable: "<yellow>No friends integration is available.</yellow>"
autaccept:
  enabled: "<green>Automatic acceptance enabled.</green>"
  disabled: "<yellow>Automatic acceptance disabled.</yellow>"
  player-enabled: "<green>Automatic acceptance enabled for <player>.</green>"
  player-disabled: "<yellow>Automatic acceptance disabled for <player>.</yellow>"
trust:
  added: "<green><player> is now trusted.</green>"
  removed: "<yellow><player> is no longer trusted.</yellow>"
  already: "<yellow><player> is already trusted.</yellow>"
  missing: "<yellow><player> is not trusted.</yellow>"
  limit: "<red>You reached the trusted-player limit (<limit>).</red>"
  list-title: "<aqua>Trusted players (<count>):</aqua>"
  list-empty: "<yellow>You have no trusted players.</yellow>"
block:
  added: "<green>Blocked <player> and invalidated <count> request(s).</green>"
  removed: "<green>Unblocked <player>.</green>"
  already: "<yellow><player> is already blocked.</yellow>"
  missing: "<yellow><player> is not blocked.</yellow>"
  list-title: "<aqua>Blocked players (<count>):</aqua>"
  list-empty: "<yellow>You have not blocked anyone.</yellow>"
settings:
  title: "<aqua>Your TpaPro settings:</aqua>"
  line: "<gray><setting>: <white><value></white></gray>"
  updated: "<green><setting> set to <value>.</green>"
  language-set: "<green>Language changed to <language>.</green>"
  locale-invalid: "<red>Unknown language. Available: <locales>.</red>"
history:
  title: "<aqua>Teleport history — page <page>/<total_pages></aqua>"
  entry: "<gray><time> • <type> • <world> <x>, <y>, <z></gray>"
  empty: "<yellow>No teleport history is available.</yellow>"
stats:
  title: "<aqua>Statistics for <player>:</aqua>"
  line: "<gray><label>: <white><value></white></gray>"
  disabled: "<yellow>Statistics are disabled.</yellow>"
admin:
  reload-success: "<green>Configuration and language files reloaded.</green>"
  reload-failed: "<red>Reload rejected; previous configuration remains active: <reason>.</red>"
  debug-enabled: "<green>Debug logging enabled.</green>"
  debug-disabled: "<yellow>Debug logging disabled.</yellow>"
  force-success: "<green>Teleported <player> to <target>.</green>"
  inspect-title: "<aqua>Inspection: <player></aqua>"
  info-title: "<aqua>TpaPro information</aqua>"
help:
  header: "<aqua><bold>TpaPro commands</bold></aqua>"
  player: "<gray>/tpa, /tpahere, /tpaccept, /tpdeny, /tpcancel, /tpalist, /tpasettings</gray>"
  social: "<gray>/tpatrust, /tpblock, /tpunblock, /tpblocklist, /tpautaccept</gray>"
  teleport: "<gray>/tpback, /tphistory, /tpastats</gray>"
  admin: "<gray>/tpapro reload|info|debug|inspect|requests|cooldown|forceteleport</gray>"
gui:
  unavailable: "<yellow>The GUI is disabled; command output is shown instead.</yellow>"
  page-invalid: "<red>That page does not exist.</red>"
